name: ParcheCAD Windows QA (F0-F7)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  windows-powershell-51:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parser and fixture tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\F0.Tests.ps1
          & .\tests\F1F2.Tests.ps1
          & .\tests\F3F4.Tests.ps1
          & .\tests\F5.Tests.ps1
          & .\tests\F7.Tests.ps1
      - name: Smoke F0 on clean Windows runner (read-only)
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          & .\src\ParcheCAD.Diagnostico.ps1 -NoExport
      - name: F7 end-to-end partial diagnostic on incomplete transaction
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\F7.Diagnostico.Integration.ps1
      - name: WinForms construction and control safety smoke (no UI interaction)
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -File .\src\ParcheCAD.Panel.ps1 -SelfTest
          if($LASTEXITCODE -ne 0) { throw "WinForms selftest error $LASTEXITCODE" }
      - name: Firewall preview smoke (read-only, no AutoCAD)
        shell: powershell
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          & .\src\ParcheCAD.Reglas.ps1 -Mode Preview
  powershell-7:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parser and fixture tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\F0.Tests.ps1
          & .\tests\F1F2.Tests.ps1
          & .\tests\F3F4.Tests.ps1
          & .\tests\F5.Tests.ps1
          & .\tests\F7.Tests.ps1

  f4-real-firewall-ephemeral:
    # Strictly hosted throwaway Windows VM; fixture is a copy of whoami.exe in TEMP.
    # No AutoCAD files, shared WebView2, third-party rules or production systems touched.
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply and revert ONLY a temporary test-program firewall rule
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\F4.RealFirewall.Integration.ps1

  f6-zip-package:
    # Artifact de desarrollo: nunca un release/instalador certificado.
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic package, hash verification, extracted smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\F6.Package.Tests.ps1
      - name: Produce curated pre-RC development ZIP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tools\Build-ParcheCAD.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ParcheCAD_4.0_DEV_NOT_RELEASE
          path: |
            dist/ParcheCAD_4.0_DEV_NO_RELEASE.zip
            dist/ParcheCAD_4.0_DEV_NO_RELEASE.zip.sha256
          if-no-files-found: error
          retention-days: 14
