name: F0 static QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  windows-powershell-51:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parser and fixture tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\F0.Tests.ps1
          & .\tests\F1F2.Tests.ps1
          & .\tests\F3F4.Tests.ps1
      - name: Smoke F0 on clean Windows runner (read-only)
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          & .\src\ParcheCAD.Diagnostico.ps1 -NoExport
      - name: Firewall preview smoke (read-only, no AutoCAD)
        shell: powershell
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          & .\src\ParcheCAD.Reglas.ps1 -Mode Preview
  powershell-7:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parser and fixture tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\F0.Tests.ps1
          & .\tests\F1F2.Tests.ps1
          & .\tests\F3F4.Tests.ps1

  f4-real-firewall-ephemeral:
    # Strictly hosted throwaway Windows VM; fixture is a copy of whoami.exe in TEMP.
    # No AutoCAD files, shared WebView2, third-party rules or production systems touched.
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply and revert ONLY a temporary test-program firewall rule
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\F4.RealFirewall.Integration.ps1
